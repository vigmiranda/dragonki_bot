version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dragonki_postgres
    restart: always
    environment:
      POSTGRES_USER: dragonki
      POSTGRES_PASSWORD: dragonki
      POSTGRES_DB: dragonki
    ports:
      - "5432:5432"
    volumes:
      - dragonki_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dragonki_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dragonki_redisdata:/data

volumes:
  dragonki_pgdata:
  dragonki_redisdata:
